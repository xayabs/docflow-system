services:
  # 1. Service สำหรับ Laravel App (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fdts_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
    command: >
      sh -c "
        php artisan storage:link &&
        php-fpm
      "
    networks:
      - fdts_network

  # 2. Service สำหรับ Nginx (Web Server)
  web:
    image: nginx:stable-alpine # ຫຼື latest-alpine #nginx:1.21-alpine
    container_name: fdts_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - db
    networks:
      - fdts_network

  # 3. Service สำหรับ MySQL Database
  db:
    image: mysql:8.0
    container_name: fdts_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "${FORWARD_DB_PORT:-33066}:3306"
    networks:
      - fdts_network

networks:
  fdts_network:
    driver: bridge

volumes:
  db-data:
    driver: local